name: Keep Streamlit awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit all Streamlit apps
        run: |
          cat > keep_alive.py <<'PYTHON'
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://div-cve-risk-calc.streamlit.app",
              "https://vulnpulse-intel-app.streamlit.app",
              "https://patchpilot.streamlit.app",
              "https://eol-radar.streamlit.app",
              "https://origynai.streamlit.app",
              "https://exposurelens.streamlit.app",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              for url in URLS:
                  page = browser.new_page()

                  try:
                      print(f"\nVisiting: {url}")

                      response = page.goto(
                          url,
                          timeout=90000,
                          wait_until="domcontentloaded"
                      )

                      if response:
                          print(f"HTTP status: {response.status}")

                      button = page.get_by_role(
                          "button",
                          name="Yes, get this app back up!"
                      )

                      if button.count() > 0:
                          print("Sleeping app detected. Waking it up...")
                          button.click()
                          page.wait_for_timeout(20000)
                      else:
                          print("App loaded. No wake-up button found.")
                          page.wait_for_timeout(5000)

                      print(f"Completed: {url}")

                  except Exception as error:
                      print(f"ERROR visiting {url}: {error}")

                  finally:
                      page.close()

              browser.close()

          PYTHON

          python keep_alive.py